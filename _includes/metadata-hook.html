<!-- Sobrescribe el placeholder del tema (Chirpy 7.x) para agregar el avatar Mechanicus de la barra lateral. -->
<script
  src="{{ '/assets/js/mechanicus.js' | relative_url }}"
  data-img="{{ '/assets/img/cristian-mechanicus.jpg' | relative_url }}"
  data-every="10000"
  data-show="4000"
  defer
></script>
<!-- Tablas anchas: clic para abrirlas en un modal (estilos al final de assets/css/jekyll-theme-chirpy.scss). -->
<script src="{{ '/assets/js/tablas-modal.js' | relative_url }}" defer></script>
{% if page.layout == 'post' %}
<!-- Enlaces del texto de los posts: se abren en una pestaña nueva. -->
<script src="{{ '/assets/js/enlaces-nueva-pestana.js' | relative_url }}" defer></script>
{% endif %}
<!-- Autodescubrimiento del feed Atom que genera Chirpy. -->
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
{% if page.url == '/about/' %}
<!-- Datos estructurados de perfil (ProfilePage + Person) para la página Sobre Mí. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "name": {{ site.social.name | jsonify }},
    "alternateName": "Tian",
    "jobTitle": "Líder de IA e Innovación",
    "worksFor": { "@type": "Organization", "name": "SmartJob", "url": "https://smartjob.cl" },
    "url": {{ page.url | absolute_url | jsonify }},
    "image": {{ site.avatar | absolute_url | jsonify }},
    "sameAs": {{ site.social.links | jsonify }}
  }
}
</script>
{% endif %}
